[project]
name = "privatelink-inference"
version = "0.1.0"
description = "A self-hosted model endpoint reachable only through a VPC endpoint service, from a separate VPC, with the public path proven to fail."
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.240.0",
    "constructs>=10.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
