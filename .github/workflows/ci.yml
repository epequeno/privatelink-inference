name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          # jsii runs the CDK, so Node is needed even for a Python CDK app.
          node-version: "22"
      - name: install the CDK CLI
        # aws-cdk-lib is the construct library only; the `cdk` CLI is a Node tool
        # and is not installed by uv.
        run: npm install -g aws-cdk@2
      - run: uv sync --quiet
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: cdk synth
        run: cd infra && uv run cdk synth --quiet
